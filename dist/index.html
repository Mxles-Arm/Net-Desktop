function setZoom(w,d){w.zoom=Math.max(.7,Math.min(1.5,w.zoom+d));w.el.querySelector('.canvas-scene').style.transform=`scale(${w.zoom})`;toast(`มุมมอง ${Math.round(w.zoom*100)}%`)}function tileWindows(){const vis=windows.filter(w=>!w.el.classList.contains('minimized')),cols=Math.ceil(Math.sqrt(vis.length)),rows=Math.ceil(vis.length/cols),W=layer.clientWidth/cols,H=layer.clientHeight/rows;vis.forEach((w,i)=>{w.el.classList.remove('maximized');w.el.style.left=(i%cols*W+4)+'px';w.el.style.top=(Math.floor(i/cols)*H+4)+'px';w.el.style.width=(W-8)+'px';w.el.style.height=(H-8)+'px'})}function editDetails(w){showDialog('Workspace Details',`<label>ชื่อ Workspace</label><input id="dialogName" value="${esc(w.name)}" style="width:100%;height:34px;margin-top:6px"><div class="dialog-actions"><button id="saveDetails">บันทึก</button></div>`);setTimeout(()=>document.querySelector('#saveDetails').onclick=()=>{w.name=document.querySelector('#dialogName').value.trim()||w.name;w.el.querySelector('.window-title').textContent=w.name;document.querySelector('#dialog').close()},0)}
document.querySelector('[data-dock=workspace]').onclick=()=>{const hidden=windows.find(w=>w.el.classList.contains('minimized'));hidden?focusWindow(hidden):newWorkspace()};document.querySelector('[data-dock=lessons]').onclick=()=>showDialog('Lessons','ภารกิจที่ 1: เชื่อม Router → Switch → Computer<br>ภารกิจที่ 2: ส่ง Packet จากเครื่องหนึ่งไปยังอีกเครื่อง');document.querySelector('[data-dock=files]').onclick=()=>{const s=localStorage.getItem('cainet.workspace');s?newWorkspace(JSON.parse(s)):toast('ยังไม่มี Workspace ที่บันทึก')};document.querySelector('[data-dock=settings]').onclick=()=>active?editDetails(active):toast('เปิด Workspace ก่อน');document.querySelector('[data-dock=trash]').onclick=()=>{if(active){active.nodes=[];active.links=[];active.notes=[];active.strokes=[];active.selected=null;render(active);toast('ล้าง Workspace แล้ว')}};document.querySelector('#assistantDock').onclick=()=>showDialog('CAI Assistant','สวัสดีครับ! เลือกอุปกรณ์จาก Sidebar ภายใน Workspace ได้เลย<br><br>เครื่องมือ Send Packet ใช้คลิกเลือกเครื่องต้นทางและปลายทางเพื่อจำลองการส่งข้อมูล');
function showDialog(title,html){const d=document.querySelector('#dialog');document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogBody').innerHTML=html+'<div class="dialog-actions"><button onclick="document.querySelector(\'#dialog\').close()">ปิด</button></div>';d.showModal()}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),1800)}function updateClock(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat('th-TH',{weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date())}updateClock();setInterval(updateClock,30000);document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;if(e.key.toLowerCase()==='n'){e.preventDefault();newWorkspace()}if(e.key.toLowerCase()==='s'){e.preventDefault();command('save')}if(e.key.toLowerCase()==='z'){e.preventDefault();command('undo')}if(e.key.toLowerCase()==='w'){e.preventDefault();command('close')}});newWorkspace();
if(document.modelContext?.registerTool){const life=new AbortController(),reg=t=>Promise.resolve(document.modelContext.registerTool(t,{signal:life.signal})).catch(()=>{});reg({name:'create_workspace',title:'สร้าง Workspace',description:'เปิดหน้าต่างจำลองเครือข่ายใหม่',inputSchema:{type:'object',properties:{name:{type:'string'}},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:i=>{const w=newWorkspace(i);return{id:w.id,name:w.name}}});reg({name:'get_desktop_state',title:'ดูสถานะ Desktop',description:'อ่าน Workspace และจำนวนอุปกรณ์ทั้งหมด',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({workspaces:windows.map(w=>({id:w.id,name:w.name,devices:w.nodes.length,links:w.links.length}))})})}
</script></body></html>
